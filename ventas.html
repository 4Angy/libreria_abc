<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas — Librería ABC</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="encabezado-sitio" class="cabecera">
    <div class="contenedor">
      <p class="marca-libreria">
        <img class="marca-imagen" src="logo.png" alt="" width="397" height="402">
        <span class="marca-nombre">Librería ABC</span>
      </p>
      <nav id="navegacion-principal" class="navegacion" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Catálogo</a></li>
          <li><a href="libros.html">Libros</a></li>
          <li><a href="clientes.html">Clientes</a></li>
          <li><a href="ventas.html" aria-current="page">Ventas</a></li>
          <li><a href="historial.html">Historial</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido-principal" class="contenedor contenido">
    <p id="mensaje-exito" class="mensaje mensaje--exito" role="status" aria-live="polite" hidden>Operación realizada correctamente.</p>

    <h1>Ventas</h1>

    <form id="ventas-form-venta" class="formulario" novalidate>
      <p id="ventas-mensaje-error" class="mensaje mensaje--error" role="alert" hidden>No se pudo registrar la venta.</p>

      <fieldset>
        <legend>Datos de la venta</legend>

        <p class="campo">
          <label for="venta-cliente">Cliente</label>
          <select id="venta-cliente" name="cliente">
            <option value="">Seleccioná un cliente</option>
          </select>
        </p>

        <p class="campo">
          <label for="venta-libro">Libro</label>
          <select id="venta-libro" name="libro">
            <option value="">Seleccioná un libro</option>
          </select>
        </p>

        <p class="campo">
          <label for="venta-cantidad">Cantidad</label>
          <input type="number" id="venta-cantidad" name="cantidad">
        </p>

        <button type="button" id="venta-boton-agregar" class="boton boton--secundario">Agregar renglón</button>
      </fieldset>

      <section class="tarjeta">
        <h2>Resumen de la venta</h2>

        <p id="venta-estado-vacio" class="estado-vacio" hidden>No hay renglones en la venta.</p>

        <div class="tabla-desplazable">
          <table id="venta-resumen-tabla" class="tabla">
            <caption>Resumen de la venta</caption>
            <thead>
              <tr>
                <th scope="col">Libro</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Precio unitario</th>
                <th scope="col">Subtotal</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="venta-renglones"></tbody>
            <tfoot>
              <tr>
                <th scope="row" colspan="3">Total</th>
                <td id="venta-total"></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>

      <button type="submit" id="venta-boton-confirmar" class="boton boton--primario">Registrar venta</button>
    </form>
  </main>

  <script src="js/datos-iniciales.js"></script>
  <script src="js/persistencia.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/altas.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
