<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo — Librería ABC</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="encabezado-sitio" class="cabecera">
    <div class="contenedor">
      <p class="marca-libreria">
        <img class="marca-imagen" src="logo.png" alt="" width="397" height="402">
        <span class="marca-nombre">Librería ABC</span>
      </p>
      <nav id="navegacion-principal" class="navegacion" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html" aria-current="page">Catálogo</a></li>
          <li><a href="libros.html">Libros</a></li>
          <li><a href="clientes.html">Clientes</a></li>
          <li><a href="ventas.html">Ventas</a></li>
          <li><a href="historial.html">Historial</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido-principal" class="contenedor contenido">
    <p id="mensaje-exito" class="mensaje mensaje--exito" role="status" aria-live="polite" hidden>Operación realizada correctamente.</p>

    <h1>Catálogo</h1>

    <form id="catalogo-form-busqueda" class="formulario tarjeta" role="search">
      <p class="campo campo--busqueda">
        <label for="catalogo-busqueda">Buscar por título</label>
        <input type="search" id="catalogo-busqueda" name="titulo">
        <button type="submit" id="catalogo-boton-buscar" class="boton boton--primario">Buscar</button>
      </p>
    </form>

    <p id="catalogo-estado-vacio" class="estado-vacio" hidden>No hay libros en el catálogo.</p>
    <p id="catalogo-estado-sin-resultados" class="estado-vacio" hidden>No se encontraron libros para la búsqueda.</p>

    <div class="tabla-desplazable">
      <table id="catalogo-tabla" class="tabla">
        <caption>Libros del catálogo</caption>
        <thead>
          <tr>
            <th scope="col">Título</th>
            <th scope="col">ISBN</th>
            <th scope="col">Editorial</th>
            <th scope="col">Género</th>
            <th scope="col">Autores</th>
            <th scope="col">Precio</th>
          </tr>
        </thead>
        <tbody id="catalogo-listado"></tbody>
      </table>
    </div>
  </main>

  <script src="js/datos-iniciales.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
